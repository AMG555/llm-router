services:
  router:
    build: .
    image: llm-router:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "7860"
      ENV: production
    # Publish 7860 only for direct/local access. When using the tunnel you can
    # delete this block so the container is reachable solely via Cloudflare.
    ports:
      - "7860:7860"
    volumes:
      - router-data:/data

  # Optional: publish the gateway through Cloudflare Tunnel.
  #   docker compose --profile tunnel up -d --build
  # Requires TUNNEL_TOKEN in .env (Zero Trust -> Networks -> Tunnels).
  # See deploy/cloudflared/README.md for the full runbook.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - router

volumes:
  router-data:
