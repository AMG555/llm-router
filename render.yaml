services:
  - type: web
    name: llm-router
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      # Secrets are generated by the platform; never commit real values.
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: GATEWAY_KEY
        generateValue: true
      - key: DB_PATH
        value: ./data/router.db
      - key: MAX_ATTEMPTS
        value: "8"
      - key: DEFAULT_COOLDOWN
        value: "20"
