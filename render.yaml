services:
  - type: web
    name: llm-router
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: ./data/router.db
      - key: MAX_ATTEMPTS
        value: "8"
      - key: DEFAULT_COOLDOWN
        value: "20"
      # Free instances sleep after ~15 min idle. Keep them warm with an
      # external pinger (e.g. UptimeRobot) hitting /health every 5-10 min;
      # an in-process self-ping cannot wake a sleeping dyno. See README.
